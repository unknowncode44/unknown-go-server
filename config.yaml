server:
  port: YOUR_PORT
  
db:
  host: YOUR_DB_HOST
  port: YOUR_DB_PORT
  user: YOUR_DB_USER
  password: YOUR_DB_PASSWORD
  dbname: YOUR_DB_NAME
  # sslmode: disable / enabled 
  timezone: YOUR_TIMEZONE

auth:
  # en produccion setear via env var AUTH_JWT_SECRET, no committear el secreto real
  jwt_secret: "INSERT_YOUR_RANDOM_GENERATED_SECRET"
  jwt_expiry_hours: 12
